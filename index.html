:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--text:#2B2B2B;--accent:#6E5A7E;--tint:#EFEAF3;
  --muted:rgba(43,43,43,.66);--line:rgba(43,43,43,.10);--line2:rgba(43,43,43,.20);
  --onAccent:#FFFFFF;--shadow:0 1px 3px rgba(0,0,0,.06);--danger:#A23B3B;--toastBg:#2B2B2B;--toastFg:#FAF8F5;--toastLink:#D9C9EA;
  --r:14px;--ri:10px;--fs:15px;
  font-family:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#16181D;--surface:#21242B;--text:#ECECEC;--accent:#B9A5CC;--tint:#2E2836;
  --muted:rgba(236,236,236,.66);--line:rgba(236,236,236,.10);--line2:rgba(236,236,236,.22);
  --onAccent:#16181D;--shadow:0 1px 3px rgba(0,0,0,.35);--danger:#E08A8A;--toastBg:#ECECEC;--toastFg:#16181D;--toastLink:#6E5A7E;
}
:root[data-text="l"]{--fs:17px}
:root[data-text="xl"]{--fs:19px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.m0{margin:0}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand svg{width:40px;height:40px;flex:0 0 40px}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;text-decoration:none;color:var(--text);font-size:15px;cursor:pointer}
.nav a svg{width:20px;height:20px;flex:0 0 20px;opacity:.75}
.nav a:hover{background:var(--tint)}
.nav a.on{background:var(--tint);color:var(--accent);font-weight:700}
.nav a.on svg{opacity:1}
.nav .sep{height:1px;background:var(--line);margin:6px 8px}
.side-foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);line-height:1.4}
.side-foot b{color:var(--text);font-weight:700}
/* main */
.main{flex:1;min-width:0;padding:28px 28px 120px}
.wrap{max-width:1100px;margin:0 auto}
.topbar{display:none}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tile{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:0 0 40px}
.tile svg{width:22px;height:22px}
.head h1{font-size:26px;font-weight:700;margin:0;line-height:1.2}
.head p{margin:2px 0 0;color:var(--muted)}
.head .grow{flex:1;min-width:180px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.head{margin-bottom:22px}
.rule{height:4px;width:56px;border-radius:4px;background:var(--accent);margin:10px 0 0}
h2{font-size:18px;font-weight:700;margin:0 0 10px}
h3{font-size:16px;font-weight:700;margin:0 0 6px}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.87em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
/* buttons and fields */
.btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:700;font-size:.93em;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.85em}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--tint)}
.icon-btn svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=date],input[type=search],input[type=password],select,textarea{width:100%;min-height:42px;border-radius:var(--ri);border:1px solid var(--line2);background:var(--bg);padding:8px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.9em;cursor:pointer;line-height:1.3}
.chip[aria-pressed="true"],.chip.on{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:700}
.tag{display:inline-block;background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.8em;font-weight:700;margin:2px 4px 2px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 20px}
/* home */
.hero{border:2px solid var(--accent);background:linear-gradient(180deg,var(--tint),var(--surface) 70%)}
.hero .big{font-size:28px;font-weight:700;line-height:1.2;margin:4px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.stat b{overflow-wrap:break-word}
.stat b.txt{font-size:17px;line-height:1.25}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.lockbtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:.85em;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer}
.up{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.up .when{min-width:84px;text-align:center;background:var(--tint);color:var(--accent);border-radius:10px;padding:6px 8px;font-weight:700;font-size:.85em;line-height:1.2}
.up .when.today{background:var(--accent);color:var(--onAccent)}
.up .what{flex:1;min-width:0}
.up .what b{display:block}
.up .what span{color:var(--muted);font-size:.88em}
.start ol{margin:8px 0 6px;padding-left:22px}
.start li{margin:5px 0}
/* lists */
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .body p{margin:4px 0}
.dot5{display:inline-flex;gap:3px;vertical-align:middle}
.dot5 i{width:8px;height:8px;border-radius:50%;background:var(--line2);display:block}
.dot5 i.on{background:var(--accent)}
.feel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.feel button{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center;font-weight:700;font-size:.9em;line-height:1.25;min-height:76px}
.feel button .dot5{display:flex;justify-content:center;margin-bottom:7px}
.feel button[aria-pressed="true"]{background:var(--tint);border:2px solid var(--accent);color:var(--accent)}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}
/* workbook */
.sec{cursor:pointer;display:block;text-align:left;width:100%;font:inherit;color:inherit;border:0;background:none;padding:0}
.card:has(.sec):hover{border-color:var(--accent)}
.sec:hover{border-color:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.pages{margin-top:12px}
.pg{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.pg:hover{color:var(--accent)}
.pg .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:0 0 22px}
.pg .tick.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.pg .tick svg{width:14px;height:14px}
.sheet{max-width:760px}
.sheet .intro{font-style:italic;color:var(--muted);margin:0 0 16px}
.fld{margin-bottom:18px}
.fld>.lab{display:block;font-weight:700;margin-bottom:6px}
.fld ol{margin:0;padding-left:26px}
.fld ol li{margin-bottom:6px}
.crumbs{font-size:.88em;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--accent);cursor:pointer;text-decoration:underline}
.saved{font-size:12.5px;color:var(--muted)}
/* people */
.ava{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:20px;flex:0 0 56px;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.ava svg{width:28px;height:28px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{min-height:58px;border-radius:10px;border:1px solid var(--line);padding:5px 6px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:space-between}
.cal .d.sel{background:var(--tint)}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap}
.cal .dots i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.calsel{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);min-height:44px}
.cal .d.out{opacity:.35}
.cal .d.today{border:2px solid var(--accent)}
.cal .d .n{font-weight:700;font-size:13px}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0}
.hbar span{width:150px;flex:0 0 150px;font-size:.9em}
.hbar .t{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:7px}
.hbar b{width:28px;text-align:right}
/* modal, toast */
.scrim{position:fixed;inset:0;background:rgba(20,18,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.25);outline:none}
.modal.wide{max-width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.mh h2{margin:0}
.mb{padding:8px 18px 4px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--toastBg);color:var(--toastFg);padding:11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;font-size:14.5px}
.toast button{background:none;border:0;color:var(--toastLink);font-weight:700;cursor:pointer;text-decoration:underline}
.fab{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--onAccent);border:0;box-shadow:0 6px 18px rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer;z-index:20}
.fab svg{width:28px;height:28px}
.chooser{display:grid;gap:8px}
.chooser button{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font-weight:700}
.chooser button svg{width:22px;height:22px;color:var(--accent)}
.note{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:.92em}
.disclaimer{font-size:12.5px;color:var(--muted);margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
.bnav{display:none}
details.faq{border-top:1px solid var(--line);padding:10px 0}
details.faq summary{cursor:pointer;font-weight:700}
details.faq p{margin:8px 0 0}
/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .box{text-align:center;max-width:340px;width:100%}
.lock .box svg.logo{width:64px;height:64px}
.pdots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pdots i.on{background:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:14px 18px;justify-content:center}
.keys button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.keys button.txt{font-size:13px}
/* phone */
@media (max-width:899px){
  .side{display:none}
  .main{padding:16px 16px 120px}
  .topbar{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
  .topbar svg.logo{width:32px;height:32px}
  .topbar b{flex:1;font-size:16px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;cursor:pointer;padding:3px 0}
  .bnav a svg{width:23px;height:23px}
  .bnav a.on{color:var(--accent);font-weight:700}
  .fab{bottom:82px;right:16px}
  .g2,.g3{grid-template-columns:1fr}
  .rule{margin-left:0}
  .head h1{font-size:23px}
  .head .actions{flex-basis:100%}
  .hbar span{width:110px;flex-basis:110px}
  .cal .d{min-height:46px;padding:3px 4px}
  .btn.sm,.chip,.lockbtn,.icon-btn{min-height:44px}
  .icon-btn{width:44px;height:44px}
  details.faq summary{padding:10px 0}
  .crumbs a{display:inline-block;padding:10px 0}
  .item{flex-wrap:wrap}
  .item .body{flex:1 1 calc(100% - 60px)}
  .item .body+.icon-btn{margin-left:auto}
  .up{flex-wrap:wrap}
  .up .what{flex:1 1 calc(100% - 100px)}
  .up .what+.icon-btn{margin-left:auto}
  .feel button{font-size:.8em;padding:10px 3px}
  .toast{bottom:150px}
}
/* print */
#printroot{display:none}
@media print{
  body{background:#fff;color:#111;font-size:11.5pt}
  .side,.bnav,.fab,.topbar,.toast,.scrim,.noprint,.head .actions{display:none!important}
  .main{padding:0}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  body.printing .app{display:none!important}
  body.printing #printroot{display:block}
}
.pr{font-family:'Lato',Arial,sans-serif;color:#111}
.pr .pgbreak{break-before:page}
.pr h1{font-size:22pt;margin:0 0 4pt}
.pr h2{font-size:15pt;margin:16pt 0 6pt;color:#3d3045}
.pr .sub{color:#555;font-size:10.5pt;margin:0 0 12pt}
.pr .intro{font-style:italic;color:#444;margin:0 0 12pt}
.pr .q{font-weight:700;margin:12pt 0 4pt;break-after:avoid}
.pr .a{white-space:pre-wrap;margin:0 0 6pt;line-height:1.5}
.pr .ln{border-bottom:1px solid #A797B5;height:24pt}
.pr .sub .nd{float:right;color:#333;font-size:10pt}
.pr ol.lines{margin:0;padding-left:20pt}
.pr ol.lines li{border-bottom:1px solid #A797B5;height:24pt}
.pr .tk{display:inline-block;margin:2pt 12pt 2pt 0}
.pr .tk i{display:inline-block;width:10pt;height:10pt;border:1px solid #333;margin-right:4pt;vertical-align:-1pt;font-style:normal;text-align:center;font-size:8pt;line-height:10pt}
.pr .cover{text-align:center;padding-top:60mm}
.pr .cover h1{font-size:34pt}
.pr .cover h1:after{content:"";display:block;width:40mm;height:2pt;background:#6E5A7E;margin:8mm auto 6mm}
.pr .cover img{width:60mm;height:60mm;object-fit:cover;border-radius:50%;margin-bottom:10mm}
.pr .fq{break-inside:avoid}
.pr .mem{break-inside:avoid;margin:0 0 12pt;padding-bottom:8pt;border-bottom:1px solid #ddd}
.pr .foot{margin-top:18pt;font-size:8.5pt;color:#777}
.pr table{width:100%;border-collapse:collapse;font-size:10pt}
.pr td,.pr th{border-bottom:1px solid #ccc;padding:5pt 4pt;text-align:left;vertical-align:top}

/* FREE DEMO BUILD ONLY */
.demo-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:.93em}
.demo-banner>div{flex:1;min-width:220px}
.pg.demo-locked{color:var(--muted)}
.demo-lock{margin-left:auto;display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--accent)}
.demo-preview{background:#fff;color:#111;border:1px solid var(--line2);border-radius:10px;padding:18px 20px;max-height:60vh;overflow:auto}
.demo-preview .pgbreak{border-top:1px dashed #bbb;margin-top:18px;padding-top:14px}
.demo-preview .cover{padding-top:10px}
.demo-preview .cover img{width:120px;height:120px}
.demo-mark{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6E5A7E;margin-bottom:8px}

function clearSample(){
  var gone=S.people.filter(function(p){return p.sample}).map(function(p){return p.id});
  S.people=S.people.filter(function(p){return !p.sample});
  S.checkins=S.checkins.filter(function(c){return !c.sample});
  S.memories=S.memories.filter(function(m){return !m.sample});
  S.dates=S.dates.filter(function(d){return !d.sample});
  Object.keys(S.answers).forEach(function(k){if(S.answers[k].sample)delete S.answers[k]});
  /* anything the buyer added that pointed at a sample person stays, unlinked */
  S.checkins.forEach(function(c){if(gone.indexOf(c.person)>=0)c.person=''});
  S.memories.forEach(function(m){if(gone.indexOf(m.person)>=0)m.person=''});
  S.dates.forEach(function(d){if(gone.indexOf(d.person)>=0)d.person=''});
  S.hasSample=false;S.cur=S.people.length?S.people[0].id:null}

/* every yearly hard date, with the next time it comes round */
function hardDates(){
  var t=todayISO(),out=[];
  S.people.forEach(function(p){
    if(p.born&&parse(p.born))out.push({id:'b-'+p.id,auto:true,name:possessive(p.name)+' birthday',date:p.born,type:'birthday',person:p.id});
    if(p.lost&&parse(p.lost))out.push({id:'l-'+p.id,auto:true,name:'Anniversary of losing '+p.name,date:p.lost,type:'loss',person:p.id})});
  S.dates.forEach(function(d){out.push({id:d.id,auto:false,name:d.name,date:d.date,type:d.type,person:d.person,note:d.note,once:d.once})});
  out.forEach(function(d){
    if(d.once){d.next=d.date;d.days=diffDays(t,d.date)}else{d.next=nextOccurrence(d.date,t);d.days=diffDays(t,d.next)}
    if(d.type==='loss'||d.type==='anniv'){var yrs=+d.next.slice(0,4)-(+d.date.slice(0,4));d.yrs=yrs>0?yrs:0}
    if(d.type==='birthday'){d.yrs=+d.next.slice(0,4)-(+d.date.slice(0,4))}});
  return out.filter(function(d){return d.days>=0}).sort(function(a,b){return a.days-b.days||a.name.localeCompare(b.name)})}

function comingUp(days){return hardDates().filter(function(d){return d.days<=days})}

/* ---------- Home ---------- */

function lastEntry(){var best0=null;Object.keys(S.answers).forEach(function(k){var a=S.answers[k],pg=PAGE[k.split('|')[1]];if(pg&&a.v&&a.v.some(filled)&&(!best0||a.at>best0.at))best0={at:a.at,pg:pg,pid:k.split('|')[0]}});var c=S.checkins.slice().sort(function(a,b){return b.date<a.date?-1:1})[0];var m=S.memories.slice().sort(function(a,b){return (b.added||'')<(a.added||'')?-1:1})[0];

  if(m&&(!best||(m.added||'')>best.when))best={when:m.added,html:'<span class="label">Memory</span><p class="m0"><b>'+esc(m.title)+'</b></p>',go:'memories'};if(best0&&(!best||best0.at>best.when)){var pp=byId(S.people,best0.pid);best={when:best0.at,html:'<span class="label">Workbook \u00b7 '+esc(fmt(best0.at))+'</span><p class="m0"><b>'+esc(nameIn(best0.pg.t,pp))+'</b></p>',go:'ws/'+best0.pg.id}}return best}
function onThisDay(){var t=todayISO();return S.memories.filter(function(m){return m.date&&m.date.slice(5)===t.slice(5)&&m.date<t})}
VIEWS.home=function(){
  var t=todayISO(),c=S.checkins.filter(function(x){return x.date===t})[0],up=comingUp(30).slice(0,5),otd=onThisDay(),le=lastEntry();

  if(!S.settings.startHidden)h+='<div class="card start" style="margin-bottom:14px"><div class="row between"><h2 class="m0">Start here</h2><button class="btn sm ghost" id="hideStart">Hide</button></div><ol><li><a href="#people">Add the person or pet you’re grieving</a> in People.</li><li><a href="#checkin">Do today’s check-in.</a> One word is enough.</li><li><a href="#workbook">Open the Workbook</a> at Early days. Write as little or as much as you like.</li></ol>'+(S.hasSample?'<p class="small muted m0">You’re looking at examples (Grandma June and Biscuit the dog). When you’re ready: Settings → Clear sample data.</p>':'')+'</div>';
  h+='<div class="grid g2"><div class="card hero"><span class="label">Today’s check-in</span>'+(c?'<div class="big">'+feelDots(c.feel)+' '+esc(lab(FEEL,c.feel))+'</div>'+(c.note?'<p class="m0">'+esc(c.note)+'</p>':'')+(c.helped&&c.helped.length?'<p class="small muted">What helped: '+esc(c.helped.join(', '))+'</p>':'')+'<a class="btn sm" href="#checkin">Edit today</a>':'<div class="big">How is today?</div><p class="muted">A word or two is enough. Nobody else will read it.</p><a class="btn pri" href="#checkin">'+ic('checkin')+'Check in</a>')+'</div>';
  h+='<div class="card"><span class="label">Coming up in the next 30 days</span>'+(up.length?up.map(function(d){return '<div class="up"><div class="when'+(d.days===0?' today':'')+'">'+esc(untilText(d.days))+'</div><div class="what"><b>'+esc(d.name)+'</b><span>'+esc(fmtLong(d.next))+(d.type==='loss'&&d.yrs?' · '+plural(d.yrs,'year')+' on':'')+'</span></div></div>'}).join(''):'<p class="muted">Nothing in the next 30 days.</p>')+'<a class="btn sm" href="#dates" style="margin-top:8px">'+ic('cal')+'All hard dates</a></div></div>';

  h+='<div class="card"><span class="label">Your journal</span><div class="stats"><div class="stat"><b>'+wk+'</b><span>check-ins this week</span></div><div class="stat"><b>'+S.memories.length+'</b><span>memories kept</span></div><div class="stat"><b>'+pagesWritten()+'</b><span>pages written</span></div></div></div></div>';

/* ---------- Check-in ---------- */
var ciDraft=null,ciShow=7;
function ciFor(date){return S.checkins.filter(function(x){return x.date===date})[0]||null}
VIEWS.checkin=function(){
  var t=todayISO();
  if(!ciDraft){var e0=ciFor(t);ciDraft=e0?JSON.parse(JSON.stringify(e0)):{id:null,date:t,feel:0,note:'',helped:[],words:[],person:S.cur||''}}
  var ex=ciFor(ciDraft.date),isT=ciDraft.date===t;
  var d=ciDraft;var words=FEEL_WORDS.concat(d.words.filter(function(w){return FEEL_WORDS.indexOf(w)<0}));

  h+='<h3 style="margin-top:18px">Any other words?</h3><div class="chips">'+words.map(function(w){return '<button class="chip" data-word="'+esc(w)+'" aria-pressed="'+(d.words.indexOf(w)>=0)+'">'+esc(w)+'</button>'}).join('')+'<button class="chip" id="addWord">+ Add a word</button></div>';
  h+='<label class="f" style="margin-top:18px"><span>A short note</span><textarea id="ciNote" maxlength="600" placeholder="Whatever is on your mind. Or leave it empty.">'+esc(d.note)+'</textarea><div class="counter"><span id="ciCount">'+d.note.length+'</span> / 600</div></label>';
  h+='<h3>'+(isT?'What helped today?':'What helped that day?')+'</h3><div class="grid g2" style="gap:0 14px">'+S.settings.helpers.map(function(x,i){return '<label class="check"><input type="checkbox" data-help="'+esc(x)+'"'+(d.helped.indexOf(x)>=0?' checked':'')+'><span>'+esc(x)+'</span></label>'}).join('')+'</div><p class="small muted">Change this list in Settings.</p>';
  if(S.people.length)h+='<label class="f"><span>Thinking of</span><select id="ciPerson"><option value="">No one in particular</option>'+opts(S.people.map(function(p){return [p.id,p.name]}),d.person)+'</select></label>';
  h+='<div class="row"><button class="btn pri" id="ciSave">'+ic('check')+(ex?(isT?'Update today’s check-in':'Update this check-in'):'Save check-in')+'</button>'+(ex?'<span class="saved">Saved. Change anything and update.</span>':'')+(isT?'':'<button class="btn ghost" id="ciToday">Back to today</button>')+'</div></div>';
  var past=S.checkins.slice().sort(function(a,b){return a.date<b.date?1:-1});
  h+='<div class="card" style="margin-top:14px"><h2>Past check-ins</h2>'+(past.length?past.slice(0,ciShow).map(function(c){return '<div class="item"><div class="body"><span class="label">'+esc(fmtLong(c.date))+'</span><p class="m0">'+feelDots(c.feel)+' <b>'+esc(lab(FEEL,c.feel))+'</b>'+(c.words&&c.words.length?' <span class="muted">· '+esc(c.words.join(', '))+'</span>':'')+'</p>'+(c.note?'<p>'+esc(c.note)+'</p>':'')+(c.helped&&c.helped.length?'<div>'+c.helped.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</div>':'')+'</div><button class="icon-btn" data-cedit="'+c.id+'" aria-label="Edit check-in for '+esc(fmt(c.date))+'">'+ic('edit')+'</button><button class="icon-btn" data-cdel="'+c.id+'" aria-label="Delete check-in for '+esc(fmt(c.date))+'">'+ic('trash')+'</button></div>'}).join('')+(past.length>ciShow?'<button class="btn" id="ciMore" style="margin-top:10px">Show '+Math.min(10,past.length-ciShow)+' more</button>':''):'<p class="muted">No check-ins yet.</p>')+'</div>';
  return h};
VIEWS.checkin.wire=function(){var d=ciDraft;if($('#ciMore'))$('#ciMore').addEventListener('click',function(){ciShow+=10;render()});
  $$('[data-feel]').forEach(function(b){b.addEventListener('click',function(){d.feel=+b.getAttribute('data-feel');$$('[data-feel]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
  $$('[data-word]').forEach(function(b){b.addEventListener('click',function(){var w=b.getAttribute('data-word'),i=d.words.indexOf(w);if(i>=0)d.words.splice(i,1);else d.words.push(w);b.setAttribute('aria-pressed',String(i<0))})});
  $('#addWord').addEventListener('click',function(){modal('Add a word','<label class="f"><span>Word</span><input type="text" id="nw" maxlength="24"></label>','<button class="btn" id="nwc">Cancel</button><button class="btn pri" id="nwok">Add</button>');$('#nwc').addEventListener('click',function(){closeModal()});var ok=function(){var w=$('#nw').value.trim().toLowerCase();if(w&&d.words.indexOf(w)<0)d.words.push(w);closeModal(true);render()};$('#nwok').addEventListener('click',ok);$('#nw').addEventListener('keydown',function(e){if(e.key==='Enter')ok()})});
  $('#ciNote').addEventListener('input',function(){d.note=this.value;$('#ciCount').textContent=this.value.length});
  $$('[data-help]').forEach(function(c){c.addEventListener('change',function(){var x=c.getAttribute('data-help'),i=d.helped.indexOf(x);if(c.checked&&i<0)d.helped.push(x);if(!c.checked&&i>=0)d.helped.splice(i,1)})});
  if($('#ciPerson'))$('#ciPerson').addEventListener('change',function(){d.person=this.value});
  $('#ciSave').addEventListener('click',function(){if(!d.feel){toast('Pick how today feels first — any of the five.');return}var ex=ciFor(d.date);var rec={id:ex?ex.id:uid(),date:d.date,feel:d.feel,note:d.note.trim(),helped:d.helped.slice(),words:d.words.slice(),person:d.person||''};if(ex)S.checkins[S.checkins.indexOf(ex)]=rec;else S.checkins.push(rec);ciDraft=null;window.scrollTo(0,0);if(save())toast(ex?'Check-in updated':'Check-in saved');render()});
  $$('[data-cedit]').forEach(function(b){b.addEventListener('click',function(){var c=byId(S.checkins,b.getAttribute('data-cedit'));ciDraft=JSON.parse(JSON.stringify(c));ciDraft.words=ciDraft.words||[];ciDraft.helped=ciDraft.helped||[];render();$('#ciCard').scrollIntoView({behavior:'smooth'})})});
  $('#ciDate').addEventListener('change',function(){var v=this.value;if(!parse(v)||v>todayISO()){this.value=ciDraft.date;toast('Pick today or an earlier day.');return}var e=ciFor(v);ciDraft=e?JSON.parse(JSON.stringify(e)):{id:null,date:v,feel:0,note:'',helped:[],words:[],person:S.cur||''};render()});
  if($('#ciToday'))$('#ciToday').addEventListener('click',function(){ciDraft=null;render()});
  $$('[data-cdel]').forEach(function(b){b.addEventListener('click',function(){var c=byId(S.checkins,b.getAttribute('data-cdel'));withUndo('Check-in deleted',function(){S.checkins.splice(S.checkins.indexOf(c),1);ciDraft=null})})})};
/* ---------- Workbook ---------- */
var openSec=null;
function personPicker(id){if(!S.people.length)return '<div class="note">Add the person or pet you’re grieving in <a href="#people">People</a> and their name will appear on the pages. You can still write without it.</div>';
  return '<label class="f" style="max-width:360px"><span>These pages are about</span><select id="'+id+'">'+opts(S.people.map(function(p){return [p.id,p.name+(isPet(p)?' (pet)':'')]}),id==='wsP'&&route.arg&&PAGE[route.arg]?(wsPerson(PAGE[route.arg])||{}).id:S.cur)+'</select></label>'}
VIEWS.workbook=function(){var p=curPerson(),secs=sectionsFor(p);
  var np=secs.reduce(function(a,s){return a+s.pages.length},0);var h=head('workbook','','Workbook',np+' worksheet pages in '+secs.length+' sections'+(isPet(p)?' (including 12 for a pet)':'')+'. Write in any order.');
  h+=personPicker('wbP');
  if(p&&!isPet(p)&&S.people.some(isPet))h+='<p class="small muted">The 12 pet-loss pages show when a pet is chosen above.</p>';
  h+='<div class="grid g2" style="margin-top:6px">'+secs.map(function(s){var done=s.pages.filter(function(pg){return pageWritten(p&&p.id,pg.id)}).length;var open=openSec===s.id;
    return '<div class="card"><button class="sec" data-sec="'+s.id+'" aria-expanded="'+open+'"><div class="row between"><h2 class="m0">'+esc(s.t)+'</h2><span class="label">'+done+' of '+s.pages.length+' pages written</span></div><p class="muted m0" style="margin-top:4px">'+esc(s.d)+'</p><div class="bar"><i style="width:'+Math.round(done/s.pages.length*100)+'%"></i></div></button>'+(open?'<div class="pages">'+s.pages.map(function(pg){var w=pageWritten(p&&p.id,pg.id);return '<button class="pg" data-pg="'+pg.id+'"><span class="tick'+(w?' on':'')+'">'+(w?ic('check'):'')+'</span><span>'+esc(nameIn(pg.t,p))+'</span></button>'}).join('')+'</div>':'')+'</div>'}).join('')+'</div>';
  return h};
VIEWS.workbook.wire=function(){if($('#wbP'))$('#wbP').addEventListener('change',function(){S.cur=this.value;save();render()});
  $$('[data-sec]').forEach(function(b){b.addEventListener('click',function(){var s=b.getAttribute('data-sec');openSec=openSec===s?null:s;render()})});
  $$('[data-pg]').forEach(function(b){b.addEventListener('click',function(){go('ws',b.getAttribute('data-pg'))})})};

/* ---------- Worksheet page ---------- */
function wsPerson(pg){var p=curPerson(),sec=SECTIONS.filter(function(s){return s.id===pg.sec})[0];if(sec.pet&&!isPet(p)){var pet=S.people.filter(isPet)[0];if(pet)return pet}return p}
function fieldHTML(f,i,v,p){var L=esc(nameIn(f[1],p,true)),id='fld'+i;
  if(f[0]==='date')return '<div class="fld"><label class="lab" for="'+id+'">'+L+'</label><input type="date" id="'+id+'" data-f="'+i+'" value="'+esc(v||'')+'" style="max-width:220px"></div>';
  if(f[0]==='scale')return '<div class="fld"><span class="lab" id="'+id+'">'+L+'</span><div class="chips" role="group" aria-labelledby="'+id+'">'+f[2].map(function(o,k){return '<button class="chip" data-f="'+i+'" data-s="'+k+'" aria-pressed="'+(v===k)+'">'+esc(o)+'</button>'}).join('')+'</div></div>';
  if(f[0]==='line')return '<div class="fld"><label class="lab" for="'+id+'">'+L+'</label><input type="text" id="'+id+'" data-f="'+i+'" value="'+esc(v||'')+'"></div>';
  if(f[0]==='box')return '<div class="fld"><label class="lab" for="'+id+'">'+L+'</label><textarea id="'+id+'" data-f="'+i+'" rows="'+Math.max(3,f[2])+'" style="min-height:'+(Math.max(3,f[2])*24+20)+'px">'+esc(v||'')+'</textarea></div>';
  if(f[0]==='list'){var a=Array.isArray(v)?v:[];var s='<div class="fld"><span class="lab" id="'+id+'">'+L+'</span><ol>';for(var k=0;k<f[2];k++)s+='<li><input type="text" aria-labelledby="'+id+'" aria-label="'+L+' '+(k+1)+'" data-f="'+i+'" data-k="'+k+'" value="'+esc(a[k]||'')+'"></li>';return s+'</ol></div>'}
  if(f[0]==='ticks'){var t=Array.isArray(v)?v:[];return '<div class="fld"><span class="lab">'+L+'</span><div class="grid g2" style="gap:0 14px">'+f[2].map(function(o,k){return '<label class="check"><input type="checkbox" data-f="'+i+'" data-t="'+k+'"'+(t.indexOf(k)>=0?' checked':'')+'><span>'+esc(o)+'</span></label>'}).join('')+'</div></div>'}
  return ''}
VIEWS.ws=function(){var pg=PAGE[route.arg];if(!pg){return VIEWS.workbook()}var p=wsPerson(pg),sec=SECTIONS.filter(function(s){return s.id===pg.sec})[0];
  var a=answer(p&&p.id,pg.id),v=a?a.v:[];
  var all=[];sectionsFor(p).forEach(function(s){s.pages.forEach(function(x){all.push(x.id)})});var ix=all.indexOf(pg.id);
  var h='<div class="crumbs"><a href="#workbook">Workbook</a> › '+esc(sec.t)+' · page '+(sec.pages.indexOf(pg)+1)+' of '+sec.pages.length+'</div>';
  h+='<div class="head"><div class="tile">'+ic('book')+'</div><div class="grow"><h1 tabindex="-1">'+esc(nameIn(pg.t,p))+'</h1><p>'+(p?'About '+esc(p.name):'Not linked to anyone yet')+'</p><div class="rule"></div></div><div class="actions"><button class="btn sm" id="pBlank">'+ic('print')+'Print blank</button><button class="btn sm" id="pFilled">'+ic('print')+'Print filled</button></div></div>';
  h+='<div class="card sheet"><p class="intro">'+esc(nameIn(pg.i,p))+'</p>'+pg.f.map(function(f,i){return fieldHTML(f,i,v[i],p)}).join('')+'<div class="row between"><span class="saved" id="wsSaved">'+(a?'Saved '+esc(fmt(a.at)):'Saves as you type')+'</span><a class="btn ghost" href="#workbook">Back to Workbook</a></div><div class="row" style="justify-content:flex-end;margin-top:8px">'+(ix>0?'<button class="btn" id="wsPrev">'+ic('left')+'Previous</button>':'')+(ix<all.length-1?'<button class="btn pri" id="wsNext">Next page'+ic('right')+'</button>':'')+'</div></div>';
  if(S.people.length>1)h+='<div style="margin-top:14px;max-width:360px">'+personPicker('wsP')+'</div>';
  VIEWS.ws._all=all;VIEWS.ws._ix=ix;return h};
VIEWS.ws.wire=function(){var pg=PAGE[route.arg];if(!pg){VIEWS.workbook.wire();return}var p=wsPerson(pg);
  var collect=function(){var v=pg.f.map(function(f,i){if(f[0]==='list')return $$('[data-f="'+i+'"]').map(function(x){return x.value});if(f[0]==='ticks')return $$('[data-f="'+i+'"]').filter(function(x){return x.checked}).map(function(x){return +x.getAttribute('data-t')});if(f[0]==='scale'){var on=$$('[data-f="'+i+'"]').filter(function(x){return x.getAttribute('aria-pressed')==='true'})[0];return on?+on.getAttribute('data-s'):''}var el=$('[data-f="'+i+'"]');return el?el.value:''});
    var k=ansKey(p&&p.id,pg.id);if(v.some(filled))S.answers[k]={v:v,at:todayISO()};else delete S.answers[k];if(save())$('#wsSaved').textContent='Saved'};
  var tm=null;$$('[data-s]').forEach(function(b){b.addEventListener('click',function(){var was=b.getAttribute('aria-pressed')==='true';$$('[data-f="'+b.getAttribute('data-f')+'"]').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed',String(!was));collect()})});$$('[data-f]:not([data-s])').forEach(function(x){x.addEventListener(x.type==='checkbox'||x.type==='date'?'change':'input',function(){clearTimeout(tm);tm=setTimeout(collect,350)});x.addEventListener('blur',function(){clearTimeout(tm);collect()})});
  var all=VIEWS.ws._all,ix=VIEWS.ws._ix;
  if($('#wsPrev'))$('#wsPrev').addEventListener('click',function(){collect();go('ws',all[ix-1])});
  if($('#wsNext'))$('#wsNext').addEventListener('click',function(){collect();go('ws',all[ix+1])});
  if($('#wsP'))$('#wsP').addEventListener('change',function(){collect();S.cur=this.value;save();render()});
  $('#pBlank').addEventListener('click',function(){collect();printNow(printWorksheet(pg,null,true))});
  $('#pFilled').addEventListener('click',function(){collect();printNow(printWorksheet(pg,wsPerson(pg),false))})};

/* ---------- Memories ---------- */
var memF={q:'',type:'',person:''};
function memIcon(t){return t==='quote'?'quote':t==='fav'?'heart':t==='keep'?'bulb':'book'}
VIEWS.memories=function(){

/* ---------- Print ---------- */
/* blank writing space is sized so every worksheet fits on one sheet of the chosen paper */
function lineBudget(pg){var B=S.settings.paper==='letter'?PRINT_LINES.letter:PRINT_LINES.a4,fixed=0,boxes=[],out={};
  pg.f.forEach(function(f,i){fixed+=1.3;if(f[0]==='line'||f[0]==='date')fixed+=1;else if(f[0]==='list')fixed+=f[2];else if(f[0]==='ticks'||f[0]==='scale')fixed+=Math.ceil(f[2].length/3)*0.75;else if(f[0]==='box')boxes.push(i)});
  var rem=Math.floor(B-fixed),rem0=rem;
  /* a box gets at most 3x its on-screen rows; anything left becomes a Notes area */
  if(boxes.length){var w=boxes.reduce(function(a,i){return a+pg.f[i][2]},0);boxes.forEach(function(i){out[i]=Math.max(3,Math.min(pg.f[i][2]*3,Math.floor(rem*pg.f[i][2]/w)));rem0-=out[i]})}
  if(rem0>=4)out.notes=Math.floor(rem0-1.3);
  return out}
var PRINT_LINES={a4:25,letter:23};
function lines(n){var r='';for(var k=0;k<n;k++)r+='<div class="ln"></div>';return r}
function prField(f,i,v,p,blank,n){var L=esc(nameIn(f[1],p,true)),s='<div class="fq"><div class="q">'+L+'</div>';
  if(f[0]==='date')return s+(blank||!v?'<div class="ln" style="width:60mm"></div>':'<p class="a">'+esc(fmt(v))+'</p>')+'</div>';
  if(f[0]==='scale')return s+'<div>'+f[2].map(function(x,k){return '<span class="tk"><i>'+(!blank&&v===k?'✓':'')+'</i>'+esc(x)+'</span>'}).join('')+'</div></div>';
  if(f[0]==='line')return s+(blank||!v?'<div class="ln"></div>':'<p class="a">'+esc(v)+'</p>')+'</div>';
  if(f[0]==='box'){if(!blank&&v)return s+'<p class="a">'+esc(v)+'</p></div>';return s+lines(n||Math.max(3,f[2]))+'</div>'}
  if(f[0]==='list'){var a=Array.isArray(v)?v:[];if(!blank&&a.some(filled))return s+'<ol class="a" style="padding-left:18pt;margin:0">'+a.filter(function(x){return String(x).trim()}).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>';var o='<ol class="lines">';for(var j=0;j<f[2];j++)o+='<li></li>';return s+o+'</ol></div>'}
  if(f[0]==='ticks'){var t=(!blank&&Array.isArray(v))?v:[];return s+'<div>'+f[2].map(function(x,k){return '<span class="tk"><i>'+(t.indexOf(k)>=0?'✓':'')+'</i>'+esc(x)+'</span>'}).join('')+'</div></div>'}
  return ''}
function printWorksheet(pg,p,blank,brk){var a=(!blank&&p)?answer(p.id,pg.id):null,v=a?a.v:[];var sec=SECTIONS.filter(function(s){return s.id===pg.sec})[0];var lb=lineBudget(pg);
  return '<section class="'+(brk?'pgbreak':'')+'"><p class="sub">'+esc(sec.t)+' · Grief Journal'+(blank?'<span class="nd">Name ____________________   Date ______________</span>':'')+'</p><h1>'+esc(nameIn(pg.t,blank?null:p))+'</h1><p class="intro">'+esc(nameIn(pg.i,blank?null:p))+'</p>'+pg.f.map(function(f,i){return prField(f,i,v[i],blank?null:p,blank,lb[i])}).join('')+(blank&&lb.notes?'<div class="fq"><div class="q">Notes</div>'+lines(lb.notes)+'</div>':'')+(blank?'':'<p class="foot">'+esc(p?'About '+p.name:'')+(a?' · written '+esc(fmt(a.at)):'')+'</p>')+'</section>'}
function printSection(sec){return sec.pages.map(function(pg,i){return printWorksheet(pg,null,true,i>0)}).join('')}
function printLog(from,to){var cs=S.checkins.filter(function(c){return c.date>=from&&c.date<=to}).sort(function(a,b){return a.date<b.date?-1:1});
  return '<section><p class="sub">Grief Journal</p><h1>Check-ins</h1><p class="intro">'+esc(fmt(from))+' to '+esc(fmt(to))+' · '+plural(cs.length,'check-in')+'</p><table><thead><tr><th>Date</th><th>Feeling</th><th>Note</th><th>What helped</th></tr></thead><tbody>'+cs.map(function(c){return '<tr><td>'+esc(fmt(c.date))+'</td><td>'+esc(lab(FEEL,c.feel))+((c.words||[]).length?'<br><small>'+esc(c.words.join(', '))+'</small>':'')+'</td><td>'+esc(c.note)+'</td><td>'+esc((c.helped||[]).join(', '))+'</td></tr>'}).join('')+'</tbody></table></section>'}
function printBook(p,o){return (p.photo&&o.photo?photoGet(p.id):Promise.resolve(null)).then(function(ph){
  var h='<section class="cover">'+(ph?'<img alt="" src="'+ph+'"><br>':'')+'<h1>'+esc(p.name)+'</h1><p class="sub" style="font-size:13pt">'+esc(relLabel(p))+(p.called?' · “'+esc(p.called)+'”':'')+'</p><p style="font-size:14pt">'+(p.born&&p.lost?esc(fmt(p.born))+' \u2013 '+esc(fmt(p.lost)):p.born?'Born '+esc(fmt(p.born)):p.lost?'Date of loss '+esc(fmt(p.lost)):'')+'</p><p class="sub" style="margin-top:30mm">A memory book</p></section>';
  var mems=S.memories.filter(function(m){return m.person===p.id&&(o.mem==='all'||m.star)&&(m.type!=='keep')});
  if(o.mem!=='none'&&mems.length)h+='<section class="pgbreak"><h1>Memories</h1>'+mems.map(function(m){return '<div class="mem"><div class="q">'+esc(m.title)+(m.date?' <span style="font-weight:400;color:#666">· '+esc(fmt(m.date))+'</span>':'')+'</div>'+(m.text?'<p class="a">'+esc(m.text)+'</p>':'')+'</div>'}).join('')+'</section>';
  var keep=S.memories.filter(function(m){return m.person===p.id&&m.type==='keep'});
  if(o.keep&&keep.length)h+='<section class="pgbreak"><h1>Things I want to remember</h1>'+keep.map(function(m){return '<div class="mem"><div class="q">'+esc(m.title)+'</div>'+(m.text?'<p class="a">'+esc(m.text)+'</p>':'')+'</div>'}).join('')+'</section>';
  var lt=SECTIONS.filter(function(s){return s.id==='letters'})[0].pages.concat([PAGE.p10]).filter(function(pg){return pageWritten(p.id,pg.id)});
  if(o.letters&&lt.length)h+='<section class="pgbreak"><h1>Letters</h1>'+lt.map(function(pg){var v=answer(p.id,pg.id).v;return '<div class="mem"><div class="q">'+esc(nameIn(pg.t,p))+'</div>'+pg.f.map(function(f,i){var x=v[i];if(Array.isArray(x)){x=x.filter(function(y){return String(y).trim()});return x.length?'<div class="q" style="font-weight:400;font-style:italic">'+esc(nameIn(f[1],p,true))+'</div><ol class="a" style="padding-left:18pt;margin:0">'+x.map(function(y){return '<li>'+esc(y)+'</li>'}).join('')+'</ol>':''}return x?'<p class="a">'+esc(x)+'</p>':''}).join('')+'</div>'}).join('')+'</section>';
  if(o.pages){var pp=[];sectionsFor(p).forEach(function(s){if(s.id==='letters')return;s.pages.forEach(function(pg){if(pg.id!=='p10'&&pageWritten(p.id,pg.id))pp.push(pg)})});pp.forEach(function(pg){h+=printWorksheet(pg,p,false,true)})}
  return h})}
function printNow(html){Promise.resolve(html).then(function(h){var r=$('#printroot');r.innerHTML='<div class="pr">'+h+'</div>';var st=$('#pagesize');st.textContent='@page{size:'+(S.settings.paper==='letter'?'letter':'A4')+';margin:16mm}';document.body.classList.add('printing');
  var done=function(){document.body.classList.remove('printing');window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
  if(window.__GJ_NOPRINT){window.__GJ_LASTPRINT=r.textContent;setTimeout(done,0);return}setTimeout(function(){window.print();setTimeout(done,500)},60)})}

  if($('#addSample'))$('#addSample').addEventListener('click',function(){addSample();save();render();toast('Examples added back')});
  $('#eraseAll').addEventListener('click',function(){confirmBox('Erase everything?','This removes every check-in, memory, worksheet page, date, person and photo from this device. It can’t be undone. Make a backup first if you might want any of it.','Next',function(){modal('Are you sure?','<p class="m0">Type <b>ERASE</b> to confirm.</p><input type="text" id="erT" style="margin-top:10px" autocomplete="off">','<button class="btn" id="erC">Cancel</button><button class="btn danger" id="erOk">Erase everything</button>');$('#erC').addEventListener('click',function(){closeModal()});$('#erOk').addEventListener('click',function(){if($('#erT').value.trim().toUpperCase()!=='ERASE'){toast('Type ERASE to confirm.');return}closeModal(true);var keep=S.settings;S=fresh();S.settings.accepted=true;S.settings.theme=keep.theme;S.settings.text=keep.text;S.settings.dateFmt=keep.dateFmt;S.settings.paper=keep.paper;photoClear();save();render();toast('Journal erased')})},true)})};
function backup(){photoAll().then(function(ph){var data={app:APP_ID,version:VERSION,exported:todayISO(),note:'Grief Journal backup. Restore it in Settings. This file is not locked by your PIN.',data:JSON.parse(JSON.stringify(S)),photos:ph};data.data.settings.pin=null;download('grief-journal-backup-'+todayISO()+'.json',JSON.stringify(data));toast('Backup saved to your downloads')})}
function restore(file){var fr=new FileReader();fr.onload=function(){var j=null;try{j=JSON.parse(fr.result)}catch(e){}
  if(!j||j.app!==APP_ID||!j.data){toast('That file isn’t a Grief Journal backup.');return}
  confirmBox('Restore this backup?','This replaces what’s in the journal on this device with the backup from '+esc(fmt(j.exported)||'an earlier date')+'. Make a backup of the current journal first if you’re not sure.','Restore',function(){var keepPin=S.settings.pin;S=normalize(j.data);S.settings.pin=keepPin;S.settings.accepted=true;photoClear().then(function(){var ph=j.photos||{};return Promise.all(Object.keys(ph).map(function(k){return photoPut(k,ph[k])}))}).then(function(){save();render();toast('Backup restored')}).catch(function(){save();render();toast('Restored. Photos couldn’t be saved in this browser.')})})};fr.readAsText(file)}

/* ---------- PIN ---------- */
function pinField(id,label){return '<label class="f"><span>'+label+'</span><input type="password" id="'+id+'" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></label>'}
function setPin(){modal('Set a PIN',pinField('pn1','New PIN (4 to 6 digits)')+pinField('pn2','Type it again')+'<div class="note"><b>Please read:</b> if you forget your PIN there is no way to reset it inside the journal — that’s what keeps it private. Your writing isn’t deleted, but to get back in you’d restore your latest backup in another browser. Back up first.</div>','<button class="btn" id="pnC">Cancel</button><button class="btn pri" id="pnOk">Set PIN</button>');
  $('#pnC').addEventListener('click',function(){closeModal()});
  var ok=function(){var a=$('#pn1').value,b=$('#pn2').value;if(!/^\d{4,6}$/.test(a)){toast('Use 4 to 6 digits.');return}if(a!==b){toast('The two PINs don’t match.');return}var salt=randHex(12);S.settings.pin={salt:salt,hash:pinHash(salt,a),len:a.length};closeModal(true);save();render();toast('PIN set. It’s asked for each time the journal opens.')};
  $('#pnOk').addEventListener('click',ok);$('#pn2').addEventListener('keydown',function(e){if(e.key==='Enter')ok()})}
function checkPin(v){var p=S.settings.pin;return !!p&&pinHash(p.salt,v)===p.hash}
function askPin(title,then){modal(title,pinField('pa','PIN'),'<button class="btn" id="paC">Cancel</button><button class="btn pri" id="paOk">OK</button>');$('#paC').addEventListener('click',function(){closeModal()});var ok=function(){if(checkPin($('#pa').value)){closeModal(true);then()}else toast('That PIN didn’t match.')};$('#paOk').addEventListener('click',ok);$('#pa').addEventListener('keydown',function(e){if(e.key==='Enter')ok()})}

/* ---------- Lock screen ---------- */
var locked=false,entry='';
function lockNow(){if(!S.settings.pin)return;closeModal(true);showLock()}
function showLock(){locked=true;entry='';$('#view').innerHTML='';var L=document.createElement('div');L.className='lock';L.id='lock';L.setAttribute('role','dialog');L.setAttribute('aria-label','Journal locked');
  L.innerHTML='<div class="box">'+LOGO.replace('<svg','<svg class="logo"')+'<h1 style="margin:12px 0 2px;font-size:24px">Grief Journal</h1><p class="muted m0">'+ic('lock')+' Enter your PIN</p><div class="pdots" id="pdots"></div><p id="pmsg" class="small" style="min-height:20px;color:var(--danger)" role="alert"></p><div class="keys">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-k="'+n+'">'+n+'</button>'}).join('')+'<button class="txt" data-k="del" aria-label="Delete last digit">Delete</button><button data-k="0">0</button><button class="txt" data-k="ok">OK</button></div><p style="margin-top:22px"><button class="btn ghost sm" id="forgot">Forgot your PIN?</button></p><div id="fhelp" class="note" hidden style="text-align:left">Your journal is still here — nothing has been deleted, and the lock never deletes anything. There’s no way to reset the PIN from inside the journal. To get back in, open the journal in a different browser (or a private window), go to Settings → Restore from backup and choose your latest backup file. The PIN is a privacy screen, not encryption.</div></div>';
  document.body.appendChild(L);dots();
  $$('[data-k]',L).forEach(function(b){b.addEventListener('click',function(){key(b.getAttribute('data-k'))})});
  $('#forgot').addEventListener('click',function(){$('#fhelp').hidden=!$('#fhelp').hidden});
  document.addEventListener('keydown',lockKeys);L.tabIndex=-1;setTimeout(function(){try{L.focus({preventScroll:true})}catch(e){}},30)}
function lockKeys(e){if(!locked)return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok')}
function dots(){var n=(S.settings.pin&&S.settings.pin.len)||Math.max(4,entry.length);var s='';for(var i=0;i<Math.max(n,entry.length);i++)s+='<i class="'+(i<entry.length?'on':'')+'"></i>';$('#pdots').innerHTML=s}
function key(k){$('#pmsg').textContent='';if(k==='del'){entry=entry.slice(0,-1);dots();return}
  if(k==='ok'){tryPin();return}if(entry.length<6){entry+=k;dots();if(S.settings.pin&&entry.length===S.settings.pin.len)setTimeout(tryPin,120)}}
function tryPin(){if(checkPin(entry)){locked=false;entry='';document.removeEventListener('keydown',lockKeys);var L=$('#lock');if(L)L.remove();start()}else{entry='';dots();$('#pmsg').textContent='That PIN didn’t match. Try again.'}}

/* ---------- Help ---------- */
VIEWS.help=function(){var h=head('help');
  h+='<div class="grid g2"><div class="card"><h2>Start here</h2><ol style="padding-left:20px;margin:0"><li style="margin-bottom:8px"><b>Look around.</b> The journal opens with examples (Grandma June and Biscuit the dog) so you can see how each screen works.</li><li style="margin-bottom:8px"><b>Add your person or pet</b> in <a href="#people">People</a>: their name, birthday and the date you lost them. Their birthday and the anniversary then appear in <a href="#dates">Hard dates</a> and on Home 30 days ahead.</li><li style="margin-bottom:8px"><b>Check in</b> when you can. One word is enough.</li><li style="margin-bottom:8px"><b>Use the Workbook</b> in any order. Pages save as you type.</li><li><b>Clear the examples</b> in Settings when you’re ready, set a PIN if you like, and <b>back up</b> now and then.</li></ol></div>';
  h+='<div class="card"><h2>Questions</h2>'+[
   ['Where is my writing kept?','Only in this browser, on this device. Nothing is sent anywhere, and there is no account or cloud.'],
   ['Does it sync to my other devices?','No. Each browser keeps its own journal. To move it, make a backup here and restore it on the other device.'],
   ['How do I back up?','Settings → Back up now. A file is saved to your downloads. Keep it somewhere safe, like a USB stick or your own cloud storage.'],
   ['What does the PIN do?','It hides the journal behind a lock screen each time it opens. It’s a privacy screen for a shared device, not encryption, and the backup file isn’t locked by it.'],
   ['I forgot my PIN.','Nothing is deleted. Open the journal in a different browser or a private window, go to Settings → Restore from backup and choose your latest backup file.'],
   ['Will clearing my browser history delete it?','Clearing “site data” or “cookies and other site data” can erase it. Back up first.'],
   ['How do I print or save a PDF?','Use Print. Pick A4 or US Letter, press a Print button, then choose a printer or “Save as PDF”.'],
   ['Does it send reminders?','No. Hard dates show on Home 30 days ahead whenever you open the journal. Nothing pops up on its own.']].map(function(q){return '<details class="faq"><summary>'+esc(q[0])+'</summary><p>'+esc(q[1])+'</p></details>'}).join('')+'</div>';
  h+='<div class="card"><h2>If you need more support</h2><p class="m0">Grief can be very heavy. You don\u2019t have to carry it alone. A doctor, a grief counsellor or a support group can help, and many countries have free phone and text support lines \u2014 search \u201cgrief support line\u201d and your country.</p><p><b>If you\u2019re in crisis or thinking about harming yourself,</b> call or text 988 in the US and Canada, 116 123 in the UK and Ireland (Samaritans), 13 11 14 in Australia (Lifeline) or 1737 in New Zealand \u2014 or call your local emergency number.</p></div><div class="card"><h2>About</h2><p class="m0">Grief Journal '+VERSION+' by SoloStack Creations. Works offline in Chrome, Safari, Edge and Firefox. Type: Lato, used under the SIL Open Font License.</p></div></div>';
  return h};

/* ---------- start ---------- */
function start(){render();if(!S.settings.accepted){modal('Before you start','<p class="m0">This is a private place to write, remember and get through hard days.</p><div class="note" style="margin-top:12px">'+esc(DISCLAIMER)+'</div><p class="small muted">Everything you write stays on this device.</p>','<button class="btn pri" id="accOk">I understand</button>',{sticky:true,noclose:true,nofocus:true});$('#accOk').addEventListener('click',function(){S.settings.accepted=true;save();closeModal(true);render()})}}
function boot(){load();applyLook();shell();if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook)}catch(e){}
  if(S.settings.pin)showLock();else start()}
document.addEventListener('DOMContentLoaded',boot);

/* ---------- FREE DEMO BUILD ONLY (added by build.py to GriefJournal-demo.html, never to the paid file) ----------
   Everything is clickable with the example journal, but: nothing is saved, backups are off,
   13 of the 60 workbook pages are open, and every printed page carries a demo mark. */
(function(){
var SHOP='https://solostackcreations.etsy.com';
var OPEN=['e1','m1','m2','m4','l1','f1','f2','a1','w1','c1','h1','p1','p3'];
window.GJ_DEMO={open:OPEN,shop:SHOP};
function isOpen(id){return OPEN.indexOf(id)>=0}
function buy(label){return '<a class="btn pri" href="'+SHOP+'" target="_blank" rel="noopener">'+esc(label||'See the full journal')+'</a>'}

/* nothing is written to this browser */
var mem={};
save=function(){return true};
load=function(){S=fresh();addSample()};
photoGet=function(id){return Promise.resolve(mem[id]||null)};
photoPut=function(id,d){mem[id]=d;return Promise.resolve(true)};
photoDel=function(id){delete mem[id];return Promise.resolve(true)};
photoAll=function(){return Promise.resolve(Object.assign({},mem))};
photoClear=function(){mem={};return Promise.resolve(true)};
backup=function(){toast('Backups are switched off in the demo. The full journal saves a backup file.')};
restore=function(){toast('Restoring is switched off in the demo.')};

/* a banner on every screen */
var _render=render;
render=function(){_render();document.title=document.title.replace('Grief Journal','Grief Journal (free demo)');if(locked)return;var sf=$('.side-foot');if(sf)sf.innerHTML='<b>Free demo.</b><br>Nothing you type here is saved.';var v=$('#view');if(!v)return;
  v.insertAdjacentHTML('afterbegin','<div class="demo-banner noprint" role="note"><div><b>Free demo.</b> Try everything with the example journal. Nothing you type is saved, and '+OPEN.length+' of the '+pageCount()+' workbook pages are open.</div>'+buy()+'</div>');
  if(route.name==='workbook')$$('[data-pg]').forEach(function(b){if(!isOpen(b.getAttribute('data-pg'))){b.classList.add('demo-locked');b.insertAdjacentHTML('beforeend','<span class="demo-lock">'+ic('lock')+'Full journal</span>')}})};

/* locked worksheet pages: title, intro and how many prompts, then the way to the full journal */
var _ws=VIEWS.ws,_wsWire=VIEWS.ws.wire;
VIEWS.ws=function(){var pg=PAGE[route.arg];if(!pg||isOpen(pg.id))return _ws();
  var p=wsPerson(pg),sec=SECTIONS.filter(function(s){return s.id===pg.sec})[0];
  var all=[];sectionsFor(p).forEach(function(s){s.pages.forEach(function(x){all.push(x.id)})});var ix=all.indexOf(pg.id);
  VIEWS.ws._all=all;VIEWS.ws._ix=ix;
  return '<div class="crumbs"><a href="#workbook">Workbook</a> › '+esc(sec.t)+' · page '+(sec.pages.indexOf(pg)+1)+' of '+sec.pages.length+'</div><div class="head"><div class="tile">'+ic('book')+'</div><div class="grow"><h1 tabindex="-1">'+esc(nameIn(pg.t,p))+'</h1><p>'+(p?'About '+esc(p.name):'')+'</p><div class="rule"></div></div></div>'+
    '<div class="card sheet"><p class="intro">'+esc(nameIn(pg.i,p))+'</p><div class="note"><b>'+ic('lock')+' This page is in the full journal.</b><br>It has '+pg.f.length+' places to write. The demo opens '+OPEN.length+' of the '+pageCount()+' pages so you can see how they work.</div><div class="row" style="margin-top:14px">'+buy('Get the full journal')+'<a class="btn ghost" href="#workbook">Back to Workbook</a></div><div class="row" style="justify-content:flex-end;margin-top:8px">'+(ix>0?'<button class="btn" id="wsPrev">'+ic('left')+'Previous</button>':'')+(ix<all.length-1?'<button class="btn pri" id="wsNext">Next page'+ic('right')+'</button>':'')+'</div></div>'};
VIEWS.ws.wire=function(){var pg=PAGE[route.arg];if(!pg||isOpen(pg.id))return _wsWire();var all=VIEWS.ws._all,ix=VIEWS.ws._ix;
  if($('#wsPrev'))$('#wsPrev').addEventListener('click',function(){go('ws',all[ix-1])});
  if($('#wsNext'))$('#wsNext').addEventListener('click',function(){go('ws',all[ix+1])})};

/* printing: open pages only, every sheet marked */
var _pw=printWorksheet;
printWorksheet=function(pg,p,blank,brk){if(isOpen(pg.id))return _pw(pg,p,blank,brk);return '<section class="'+(brk?'pgbreak':'')+'"><h1>'+esc(nameIn(pg.t,null))+'</h1><p class="intro">This page is in the full Grief Journal. The free demo prints '+OPEN.length+' of the '+pageCount()+' pages.</p></section>'};
printSection=function(sec){var open=sec.pages.filter(function(pg){return isOpen(pg.id)});return open.map(function(pg,i){return _pw(pg,null,true,i>0)}).join('')+'<section class="pgbreak"><h1>'+esc(sec.t)+'</h1><p class="intro">The free demo prints '+open.length+' of the '+sec.pages.length+' pages in this section. The full Grief Journal prints them all.</p></section>'};

/* web-safe addresses: claude.ai and some hosts reserve #settings and drop "/" in a hash */
SCREENS.forEach(function(x){if(x[0]==='settings')x[0]='journal-settings'});VIEWS['journal-settings']=VIEWS.settings;
var _head=head;head=function(k,a,t,sub){return _head(k==='settings'?'journal-settings':k,a,t,sub)};
var _sep=navHTML;navHTML=function(){_sep();var j=$('#nav a[href="#journal-settings"]');if(j&&!(j.previousElementSibling&&j.previousElementSibling.className==='sep'))j.insertAdjacentHTML('beforebegin','<div class="sep"></div>')};
go=function(name,arg){if(name==='settings')name='journal-settings';location.hash=name+(arg?'-'+arg:'')};
readHash=function(){var h=(location.hash||'#home').slice(1).replace('/','-');var m=h.match(/^ws-(.+)$/);route=m?{name:'ws',arg:m[1]}:{name:h||'home',arg:''};
  var ok=SCREENS.some(function(x){return x[0]===route.name})||route.name==='ws';if(!ok||(route.name==='patterns'&&!S.settings.showPatterns))route={name:'home',arg:''}};
var _r2=render;render=function(){_r2();$$('a[href^="#ws/"]').forEach(function(a){a.setAttribute('href',a.getAttribute('href').replace('#ws/','#ws-'))})};

/* printing in the demo shows the page on screen; the full journal sends it to your printer */
printNow=function(h){Promise.resolve(h).then(function(x){var body='<div class="pr demo-preview"><div class="demo-mark">Free demo · print preview</div>'+x+'</div>';window.__GJ_LASTPRINT=body.replace(/<[^>]+>/g,' ');
  modal('Print preview','<p class="small muted m0" style="margin-bottom:10px">In the full journal this opens your printer, or “Save as PDF”, on '+(S.settings.paper==='letter'?'US Letter':'A4')+' paper.</p>'+body,buy('Get the full journal'),{wide:true,nofocus:true})})};

/* first open says it's a demo */
var _start=start;
start=function(){_start();var m=$('#scrim .mb');if(m)m.insertAdjacentHTML('afterbegin','<div class="demo-banner" style="margin-bottom:12px"><div><b>This is the free demo.</b> Nothing you type is saved.</div></div>')};
document.title='Grief Journal · Free demo';
})();

</script>
